name: Verify Linux

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            brightnessctl \
            wl-clipboard \
            xclip \
            wmctrl \
            network-manager \
            playerctl

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and bundle frontend
        run: pnpm build

      - name: Compile Rust backend and run unit tests
        working-directory: src-tauri
        run: cargo test -- --test-output immediate

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy lint
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
